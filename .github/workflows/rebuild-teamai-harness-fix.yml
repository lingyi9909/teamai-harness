name: Finish minimal TeamAI harness rebuild

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/rebuild-teamai-harness-fix.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[rebuild-teamai-harness-fix]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Rebuild and verify
        shell: bash
        run: |
          set -euo pipefail
          source_workflow=.github/workflows/rebuild-teamai-harness.yml
          test -f "$source_workflow"

          git clone --quiet --depth 1 --branch v6.3.0 https://github.com/obra/superpowers.git "$RUNNER_TEMP/superpowers"
          test "$(git -C "$RUNNER_TEMP/superpowers" rev-parse HEAD)" = "b36e0829c6d0140e93cfef2ca599b1b07d4a7797"

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/rebuild-teamai-harness.yml').read_text()
          wanted = [
              'rules/java-coding-style.md',
              'rules/java-spring.md',
              'rules/java-testing.md',
              'rules/java-security.md',
              'rules/java-build-offline.md',
              'README.md',
          ]
          extracted = {}
          for path in wanted:
              pattern = rf"          cat > {re.escape(path)} <<'EOF'\n(.*?)\n          EOF"
              match = re.search(pattern, source, flags=re.S)
              if not match:
                  raise SystemExit(f'missing heredoc for {path}')
              lines = match.group(1).splitlines()
              lines = [line[10:] if line.startswith('          ') else line for line in lines]
              text = '\n'.join(line.rstrip() for line in lines) + '\n'
              extracted[path] = text

          for path, text in extracted.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)
          PY

          rm -rf agents docs skills third_party .opencode
          rm -f teamai.yaml
          mkdir -p skills third_party/superpowers
          cp -a "$RUNNER_TEMP/superpowers/skills/." skills/
          cp "$RUNNER_TEMP/superpowers/LICENSE" third_party/superpowers/LICENSE
          cat > third_party/superpowers/VERSION <<'EOF'
          upstream: https://github.com/obra/superpowers
          version: v6.3.0
          commit: b36e0829c6d0140e93cfef2ca599b1b07d4a7797
          license: MIT
          EOF

          diff -qr "$RUNNER_TEMP/superpowers/skills" skills
          test "$(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l | tr -d ' ')" = "14"
          test "$(find rules -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = "5"
          test ! -e agents
          test ! -e docs
          test ! -e teamai.yaml
          test ! -e .opencode
          grep -q '^name: brainstorming$' skills/brainstorming/SKILL.md
          grep -q '^name: using-superpowers$' skills/using-superpowers/SKILL.md
          grep -q '^name: verification-before-completion$' skills/verification-before-completion/SKILL.md

          rm -rf .github
          git config user.name "teamai-harness-builder"
          git config user.email "teamai-harness-builder@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: simplify harness to Superpowers and Java rules"
          git push origin HEAD:develop
